body{font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;color:var(--txt);line-height:1.4;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(2rem + env(safe-area-inset-bottom)) env(safe-area-inset-left)}

.hasbg body::before{display:none}
#bg{position:fixed;inset:0;z-index:-3;background-size:cover;background-position:center}

.ib{display:flex;gap:.5rem}
.ib button{width:46px;height:46px;border-radius:50%;border:1px solid var(--gb);background:var(--glass);color:var(--txt);font-size:1.25rem;cursor:pointer;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card{background:var(--glass);border:1px solid var(--gb);border-radius:24px;padding:1rem;margin-top:.9rem;box-shadow:0 10px 32px var(--sh);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.lbl.hd{margin:1.1rem 0 .5rem .2rem}
.rd{font-size:1.65rem;font-weight:700;line-height:1.2;margin:.3rem 0 .2rem;letter-spacing:-.01em}
.rd.s{font-size:1.2rem;margin:.25rem 0}
.meta,.sline{font-size:.88rem;color:var(--mut)}
.none{color:var(--mut);padding:.4rem 0;font-size:.95rem}
.bar{height:10px;background:var(--g2);border-radius:6px;overflow:hidden;margin:.8rem 0 .4rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(var(--acc-rgb),.6),rgba(var(--acc-rgb),1));border-radius:6px}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:.5rem;margin-top:.8rem}
.main,.ghost{min-height:52px;border-radius:15px;font-size:1.02rem;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;text-align:center}
.main{border:1px solid rgba(255,255,255,.35);background:linear-gradient(135deg,rgba(var(--acc-rgb),.98),rgba(var(--acc-rgb),.72));color:#fff;box-shadow:0 8px 22px rgba(var(--acc-rgb),.4)}
.main:active{transform:scale(.985)}
.ghost{border:1px solid var(--gb);background:var(--g2);color:var(--txt);font-weight:600}
.ghost:active{background:rgba(var(--acc-rgb),.3)}
.ghost.danger{color:#ff6b6b;width:100%;margin-top:1.2rem}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.bk{min-height:48px;border-radius:13px;padding:.4rem .3rem;font-size:.74rem;font-weight:600;color:var(--txt);cursor:pointer;font-family:inherit;border:1px solid var(--gb);background:linear-gradient(90deg,rgba(var(--acc-rgb),.5) var(--f),var(--g2) var(--f));word-break:break-word}
.bk.full{border-color:var(--acc)}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.8rem}
.cell{background:var(--g2);border:1px solid var(--gb);border-radius:14px;padding:.55rem .3rem;text-align:center}
.cell b{display:block;font-size:1.05rem}
.cell span{font-size:.68rem;color:var(--mut)}
.pct{font-size:2.6rem;font-weight:700;line-height:1;letter-spacing:-.03em}
.pct small{font-size:1.2rem;color:var(--mut);margin-left:.15rem}
.h{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--gb)}
.h em{display:block;font-style:normal;color:var(--mut);font-size:.8rem}
.del{flex:0 0 44px;height:44px;border:0;background:transparent;color:var(--mut);font-size:1.1rem;cursor:pointer}
/* Modals */
.modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,8,25,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal.open{display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--gb);border-radius:26px 26px 0 0;animation:up .22s ease-out;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.modal.open{align-items:center}.sheet{border-radius:26px}}
.sh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1rem .4rem 1.2rem;font-size:1.15rem}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--gb);background:var(--g2);color:var(--txt);font-size:1.05rem;cursor:pointer}
.sb{overflow:auto;-webkit-overflow-scrolling:touch;padding:.3rem 1.2rem 1rem;flex:1}
.sf{display:grid;grid-template-columns:1fr 1.8fr;gap:.5rem;padding:.7rem 1.2rem calc(.9rem + env(safe-area-inset-bottom));border-top:1px solid var(--gb)}
.sb .lbl{margin:.9rem 0 .35rem}
.sel3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.4rem}
select,input[type=date]{width:100%;height:50px;padding:0 .6rem;border-radius:14px;border:1px solid var(--gb);background:var(--g2);color:var(--txt);font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=range]{width:100%;height:44px;accent-color:var(--acc)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.quick .ghost{min-height:44px;font-size:.92rem}
.seg{display:flex;background:var(--g2);border:1px solid var(--gb);border-radius:15px;padding:3px}
.seg button{flex:1;min-height:44px;border:1px solid transparent;background:transparent;color:var(--txt);font-size:.98rem;font-weight:600;border-radius:12px;cursor:pointer;font-family:inherit}
.seg button.on{background:rgba(var(--acc-rgb),.3);border-color:var(--acc)}
.sw{display:flex;gap:.55rem;flex-wrap:wrap}
.sw button,.sw input{width:42px;height:42px;border-radius:50%;border:2px solid var(--gb);cursor:pointer;padding:0;background:none}
.sw button.on{border-color:var(--txt);box-shadow:0 0 0 2px var(--acc)}
.chs{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem}
.ch{min-height:50px;border-radius:13px;font-size:1rem;font-weight:700;color:var(--txt);cursor:pointer;font-family:inherit;border:1px solid var(--gb);background:linear-gradient(90deg,rgba(var(--acc-rgb),.55) var(--f),var(--g2) var(--f))}

#toast.show{opacity:1;transform:translate(-50%,0)}

</head>
<body>
<div id="bg"></div><div id="dimv"></div>
<div class="wrap">
  <header><h1 data-k="title"></h1><div class="ib"><button id="bProg" aria-label="Progress">📊</button><button id="bSet" aria-label="Settings">⚙️</button></div></header>
  <section class="card" id="last"></section>
  <section class="card" id="next"></section>
  <div id="shelf"></div>
</div>

<!-- Lesung wählen -->
<div class="modal" id="mRead"><div class="sheet">
  <div class="sh"><b data-k="read"></b><button class="x" data-x>✕</button></div>
  <div class="sb">
    <div class="rd" id="rrd"></div><div class="meta" id="rmeta"></div>
    <input type="range" id="rsl" min="1" value="1">
    <div class="quick"><button class="ghost" id="qs" data-k="qs"></button><button class="ghost" id="qc" data-k="qc"></button></div>
    <div class="lbl" data-k="fromL"></div>
    <div class="sel3"><select id="fB"></select><select id="fC"></select><select id="fV"></select></div>
    <div class="lbl" data-k="toL"></div>
    <div class="sel3"><select id="tB"></select><select id="tC"></select><select id="tV"></select></div>
    <div class="lbl" data-k="date"></div>
    <input type="date" id="rdate">
  </div>
  <div class="sf"><button class="ghost" data-x data-k="cancel"></button><button class="main" id="rMark" data-k="mark"></button></div>
</div></div>

<!-- Kapitel eines Buchs -->
<div class="modal" id="mBook"><div class="sheet">
  <div class="sh"><b id="bkT"></b><button class="x" data-x>✕</button></div>
  <div class="sb"><div class="chs" id="chs"></div></div>
</div></div>

<!-- Fortschritt -->
<div class="modal" id="mProg"><div class="sheet">
  <div class="sh"><b data-k="prog"></b><button class="x" data-x>✕</button></div>
  <div class="sb" id="pBody"></div>
</div></div>

<!-- Einstellungen -->
<div class="modal" id="mSet"><div class="sheet">
  <div class="sh"><b data-k="set"></b><button class="x" data-x>✕</button></div>
  <div class="sb">
    <div class="lbl" data-k="lang"></div>
    <div class="seg" id="langSeg"><button data-l="ru">Русский</button><button data-l="de">Deutsch</button><button data-l="en">English</button></div>
    <div class="lbl" data-k="plan"></div>
    <div class="seg" id="modeSeg"><button data-m="1" data-k="m1"></button><button data-m="3" data-k="m3"></button></div>
    <div class="lbl" data-k="look"></div>
    <div class="seg" id="thSeg"><button data-th="auto" data-k="auto"></button><button data-th="light" data-k="light"></button><button data-th="dark" data-k="dark"></button></div>
    <div class="lbl" data-k="accent"></div>
    <div class="sw" id="sw"></div>
    <div class="lbl" data-k="bg"></div>
    <div class="row2" style="margin-top:0;grid-template-columns:1fr 1fr"><label class="ghost" for="bgIn" data-k="pickBg"></label><button class="ghost" id="bgRm" data-k="rmBg"></button></div>
    <input type="file" id="bgIn" accept="image/*" hidden>
    <div class="lbl" data-k="dim"></div>
    <input type="range" id="dimIn" min="0" max="80">
    <div class="lbl" data-k="backup"></div>
    <div class="row2" style="margin-top:0;grid-template-columns:1fr 1fr"><button class="ghost" id="exp" data-k="exp"></button><label class="ghost" for="imp" data-k="imp"></label></div>
    <input type="file" id="imp" accept="application/json,.json" hidden>
    <button class="ghost danger" id="reset" data-k="reset"></button>
  </div>
</div></div>
<div id="toast"></div>

 de:{title:"📖 Bibel-Leseplan",m1:"1 Jahr",m3:"3 Jahre",last0:"Zuletzt gelesen",none:"Noch nichts gelesen. Tippe auf „Ändern“ oder wähle unten ein Buch.",nextL:"Als Nächstes",done:"✓ Gelesen",chg:"Ändern",verses:"Verse",sugg:"Vorschlag",ot:"Hebräische Schriften",nt:"Griechische Schriften",prog:"Fortschritt",set:"Einstellungen",read:"Lesung wählen",fromL:"Von",toL:"Bis",date:"Gelesen am",qs:"Vorschlag",qc:"Kapitelende",cancel:"Abbrechen",mark:"✓ Als gelesen markieren",saved:"Gespeichert ✓",perDay:"Ø Verse/Tag",finish:"Fertig ca.",ahead:"voraus",behind:"zurück",onplan:"im Plan",streak:"Tage in Folge",days:"Lesetage",bdone:"Bücher fertig",hist:"Verlauf",noneH:"Noch keine Einträge.",del:"Eintrag löschen?",lang:"Sprache",plan:"Plan",look:"Darstellung",auto:"Auto",light:"Hell",dark:"Dunkel",accent:"Farbe",bg:"Hintergrundbild",pickBg:"Bild wählen",rmBg:"Entfernen",dim:"Abdunkeln",backup:"Sicherung",exp:"Exportieren",imp:"Importieren",reset:"Alles zurücksetzen",ask:"Fortschritt und Verlauf komplett löschen?",fin:"🎉 Bibel komplett gelesen!",ago:n=>n<1?"Heute gelesen":n===1?"Gestern gelesen":"Vor "+n+" Tagen gelesen",already:n=>n+" schon gelesen"},
 ru:{title:"📖 План чтения Библии",m1:"1 год",m3:"3 года",last0:"Последнее чтение",none:"Пока ничего не прочитано. Нажмите «Изменить» или выберите книгу ниже.",nextL:"Далее",done:"✓ Прочитано",chg:"Изменить",verses:"стихов",sugg:"план",ot:"Еврейские Писания",nt:"Греческие Писания",prog:"Прогресс",set:"Настройки",read:"Выбор чтения",fromL:"С",toL:"До",date:"Дата чтения",qs:"План",qc:"Конец главы",cancel:"Отмена",mark:"✓ Отметить прочитанным",saved:"Сохранено ✓",perDay:"Ø стихов/день",finish:"Закончу ~",ahead:"впереди",behind:"отставание",onplan:"по плану",streak:"дней подряд",days:"дней чтения",bdone:"книг прочитано",hist:"История",noneH:"Записей пока нет.",del:"Удалить запись?",lang:"Язык",plan:"План",look:"Оформление",auto:"Авто",light:"Светлая",dark:"Тёмная",accent:"Цвет",bg:"Фоновое изображение",pickBg:"Выбрать фото",rmBg:"Убрать",dim:"Затемнение",backup:"Резервная копия",exp:"Экспорт",imp:"Импорт",reset:"Сбросить всё",ask:"Удалить весь прогресс и историю?",fin:"🎉 Вся Библия прочитана!",ago:n=>n<1?"Прочитано сегодня":n===1?"Прочитано вчера":"Прочитано "+n+" дн. назад",already:n=>n+" уже прочитано"},
 en:{title:"📖 Bible Reading Plan",m1:"1 year",m3:"3 years",last0:"Last read",none:"Nothing read yet. Tap “Change” or pick a book below.",nextL:"Up next",done:"✓ Done",chg:"Change",verses:"verses",sugg:"suggested",ot:"Hebrew Scriptures",nt:"Greek Scriptures",prog:"Progress",set:"Settings",read:"Choose reading",fromL:"From",toL:"To",date:"Read on",qs:"Suggested",qc:"Chapter end",cancel:"Cancel",mark:"✓ Mark as read",saved:"Saved ✓",perDay:"Ø verses/day",finish:"Finish ~",ahead:"ahead",behind:"behind",onplan:"on plan",streak:"day streak",days:"days read",bdone:"books done",hist:"History",noneH:"No entries yet.",del:"Delete entry?",lang:"Language",plan:"Plan",look:"Appearance",auto:"Auto",light:"Light",dark:"Dark",accent:"Colour",bg:"Background image",pickBg:"Choose photo",rmBg:"Remove",dim:"Dimming",backup:"Backup",exp:"Export",imp:"Import",reset:"Reset everything",ask:"Delete all progress and history?",fin:"🎉 Whole Bible read!",ago:n=>n<1?"Read today":n===1?"Read yesterday":"Read "+n+" days ago",already:n=>n+" already read"}
};
// Kapitel-/Verstabelle
const CH=[];BK.forEach((b,i)=>b[3].split(",").forEach((v,j)=>CH.push([i,j+1,+v])));
const CS=[],CBS=[],NC=BK.map(b=>b[3].split(",").length);let V=0;
CH.forEach((c,i)=>{CS.push(V);V+=c[2];if(c[1]===1)CBS[c[0]]=i});
const BS=BK.map((b,i)=>CS[CBS[i]]),BV=BK.map(b=>b[3].split(",").reduce((x,y)=>x+ +y,0));
function loc(g){let lo=0,hi=CS.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(CS[m]<=g)lo=m;else hi=m-1}const c=CH[lo];return{b:c[0],c:c[1],v:g-CS[lo]+1}}
const one=b=>NC[b]===1;
function ref(p,lang){const n=BK[p.b][L[lang]];return one(p.b)?n+" "+p.v:n+" "+p.c+":"+p.v}
function rng(ai,bi,lang){
  const a=loc(ai),z=loc(bi),n=BK[a.b][L[lang]];
  if(a.b===z.b){
    if(one(a.b))return a.v===z.v?n+" "+a.v:n+" "+a.v+"–"+z.v;
    if(a.c===z.c)return a.v===z.v?n+" "+a.c+":"+a.v:n+" "+a.c+":"+a.v+"–"+z.v;
    return n+" "+a.c+":"+a.v+"–"+z.c+":"+z.v;
  }
  return ref(a,lang)+" – "+ref(z,lang);
}


// ---------- Zustand: log = [von,bis,Datum]; "gelesen" = Vereinigung aller Einträge ----------
const KEY="bibel_leseplan_v4",BGK="bibel_leseplan_bg";
let S={lang:null,mode:"3",theme:"auto",acc:"#3c96ff",dim:35,log:[]};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x)}catch(e){}
S.log=(Array.isArray(S.log)?S.log:[]).filter(l=>Array.isArray(l)&&l.length===3&&l[0]>=0&&l[1]<V&&l[0]<=l[1]);
if(!S.lang){const n=(navigator.language||"de").slice(0,2);S.lang=T[n]?n:"de"}
let BGD=null;try{BGD=localStorage.getItem(BGK)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const ymd=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDay=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const nf=n=>n.toLocaleString(LOC[S.lang]);
const fmtD=(d,o)=>d.toLocaleDateString(LOC[S.lang],o);
const sugg=()=>Math.ceil(V/(S.mode==="1"?365:1095));
const cmp=(a,b)=>a[0][2]<b[0][2]?-1:a[0][2]>b[0][2]?1:a[1]-b[1];
const ord=()=>S.log.map((l,i)=>[l,i]).sort(cmp).map(x=>x[0]);

let RD=[];
function calc(){
  const a=S.log.map(l=>[l[0],l[1]]).sort((x,y)=>x[0]-y[0]);RD=[];
  for(const r of a){const l=RD[RD.length-1];if(l&&r[0]<=l[1]+1)l[1]=Math.max(l[1],r[1]);else RD.push([r[0],r[1]])}
}
const covered=()=>RD.reduce((s,r)=>s+r[1]-r[0]+1,0);
function ovl(a,b){let n=0;for(const r of RD){if(r[1]<a)continue;if(r[0]>b)break;n+=Math.min(b,r[1])-Math.max(a,r[0])+1}return n}
function nextUnread(g){
  if(g>=V)g=0;
  for(const r of RD){if(r[1]<g)continue;if(r[0]>g)break;g=r[1]+1}
  if(g<V)return g;
  g=0;for(const r of RD){if(r[0]>g)break;g=r[1]+1}
  return g<V?g:V;
}
function nextRange(){
  if(covered()>=V)return null;
  const o=ord(),f=nextUnread(o.length?o[o.length-1][1]+1:0);
  return f>=V?null:[f,Math.min(V-1,f+sugg()-1)];
}

// ---------- Theme / Hintergrund ----------
const mq=matchMedia("(prefers-color-scheme: dark)");
const hex2rgb=h=>{const n=parseInt((h||"").slice(1),16);return isNaN(n)?"60,150,255":[n>>16&255,n>>8&255,n&255].join(",")};
function theme(){
  const dark=S.theme==="auto"?mq.matches:S.theme==="dark",r=document.documentElement;
  r.dataset.t=dark?"dark":"light";r.style.setProperty("--acc-rgb",hex2rgb(S.acc));
  r.classList.toggle("hasbg",!!BGD);
  $("bg").style.backgroundImage=BGD?"url("+BGD+")":"";
  const a=S.dim/100;$("dimv").style.background=BGD?(dark?"rgba(0,8,24,"+a+")":"rgba(255,255,255,"+a+")"):"";
}
mq.addEventListener&&mq.addEventListener("change",theme);

// ---------- Modals ----------
const open=id=>{$(id).classList.add("open");document.body.classList.add("lock")};
const close=id=>{$(id).classList.remove("open");if(!document.querySelector(".modal.open"))document.body.classList.remove("lock")};
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-x]"))close(m.id)}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".modal.open").forEach(m=>close(m.id))});
let tt;function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}

// ---------- Startseite ----------
function home(){
  const t=T[S.lang],o=ord(),cov=covered(),pct=Math.round(cov/V*1000)/10;
  let h;
  if(o.length){const d=o[o.length-1][2];h='<div class="lbl">'+t.ago(Math.max(0,dayDiff(d,ymd())))+'</div>'+o.filter(x=>x[2]===d).map(x=>'<div class="rd s">'+rng(x[0],x[1],S.lang)+'</div>').join("")}
  else h='<div class="lbl">'+t.last0+'</div><div class="none">'+t.none+'</div>';
  $("last").innerHTML=h+'<div class="bar"><i style="width:'+cov/V*100+'%"></i></div><div class="sline">'+pct+'% · '+nf(cov)+' / '+nf(V)+' '+t.verses+'</div>';
  const r=nextRange();
  $("next").innerHTML=r?'<div class="lbl">'+t.nextL+'</div><div class="rd">'+rng(r[0],r[1],S.lang)+'</div><div class="meta">'+(r[1]-r[0]+1)+' '+t.verses+'</div><div class="row2"><button class="ghost" data-a="chg">'+t.chg+'</button><button class="main" data-a="done">'+t.done+'</button></div>':'<div class="rd">'+t.fin+'</div>';
  let b="";
  BK.forEach((k,i)=>{
    if(i===0)b+='<div class="lbl hd">'+t.ot+'</div><div class="books">';
    if(i===39)b+='</div><div class="lbl hd">'+t.nt+'</div><div class="books">';
    const f=ovl(BS[i],BS[i]+BV[i]-1)/BV[i];
    b+='<button class="bk'+(f>=1?' full':'')+'" data-b="'+i+'" style="--f:'+f*100+'%">'+k[L[S.lang]]+'</button>';
  });
  $("shelf").innerHTML=b+'</div>';
}
function texts(){
  const t=T[S.lang];document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=t[e.dataset.k]);
}
function sync(){
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang));
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===S.mode));
  document.querySelectorAll("#thSeg button").forEach(b=>b.classList.toggle("on",b.dataset.th===S.theme));
  document.querySelectorAll("#sw button").forEach(b=>b.classList.toggle("on",b.dataset.c===S.acc));
  $("accIn").value=/^#[0-9a-f]{6}$/i.test(S.acc)?S.acc:"#3c96ff";$("dimIn").value=S.dim;
}
function renderAll(){calc();texts();home();sync();if($("mProg").classList.contains("open"))prog()}
function add(f,e,d){S.log.push([f,e,d]);save();close("mRead");renderAll();toast(T[S.lang].saved)}

// ---------- Lesung wählen (Modal) ----------
let D={f:0,e:0,d:""};
function openRead(f,e){D={f:f,e:e,d:ymd()};fillRead();open("mRead")}
function selFill(p,idx){
  const q=loc(idx);
  $(p+"B").innerHTML=BK.map((b,i)=>'<option value="'+i+'"'+(i===q.b?' selected':'')+'>'+b[L[S.lang]]+'</option>').join("");
  let h="";for(let c=1;c<=NC[q.b];c++)h+='<option'+(c===q.c?' selected':'')+'>'+c+'</option>';$(p+"C").innerHTML=h;
  const nv=CH[CBS[q.b]+q.c-1][2];h="";for(let v=1;v<=nv;v++)h+='<option'+(v===q.v?' selected':'')+'>'+v+'</option>';$(p+"V").innerHTML=h;
}
function info(){
  const t=T[S.lang],o=ovl(D.f,D.e);
  $("rrd").textContent=rng(D.f,D.e,S.lang);
  $("rmeta").textContent=(D.e-D.f+1)+" "+t.verses+" · "+t.sugg+" "+sugg()+(o?" · "+t.already(o):"");
}
function fillRead(){
  info();selFill("f",D.f);selFill("t",D.e);
  const n=D.e-D.f+1,sl=$("rsl");sl.max=Math.max(n,Math.min(V-D.f,Math.max(sugg()*4,150)));sl.value=n;
  $("rdate").max=ymd();$("rdate").value=D.d;
}
["f","t"].forEach(p=>["B","C","V"].forEach(k=>$(p+k).onchange=e=>{
  let b=+$(p+"B").value,c=+$(p+"C").value,v=+$(p+"V").value;
  if(k==="B"){c=1;v=1}else if(k==="C")v=1;
  c=Math.min(c,NC[b]);const ci=CBS[b]+c-1;v=Math.min(v,CH[ci][2]);const g=CS[ci]+v-1;
  if(p==="f"){const n=D.e-D.f+1;D.f=g;D.e=Math.min(V-1,g+n-1)}else D.e=Math.max(D.f,g);
  fillRead();
}));
$("rsl").oninput=e=>{D.e=D.f+(+e.target.value)-1;info()};
$("rsl").onchange=fillRead;
$("qs").onclick=()=>{D.e=Math.min(V-1,D.f+sugg()-1);fillRead()};
$("qc").onclick=()=>{const p=loc(D.e);let ci=CBS[p.b]+p.c-1;if(D.e===CS[ci]+CH[ci][2]-1&&ci<CH.length-1)ci++;D.e=CS[ci]+CH[ci][2]-1;fillRead()};
$("rdate").onchange=e=>{D.d=e.target.value||ymd()};
$("rMark").onclick=()=>add(D.f,D.e,D.d>ymd()?ymd():D.d);

// ---------- Kapitel-Modal ----------
function openBook(b){
  $("bkT").textContent=BK[b][L[S.lang]];
  let h="";
  for(let c=1;c<=NC[b];c++){const ci=CBS[b]+c-1,n=CH[ci][2],f=ovl(CS[ci],CS[ci]+n-1)/n;h+='<button class="ch'+(f>=1?' full':'')+'" data-c="'+ci+'" style="--f:'+f*100+'%">'+c+'</button>'}
  $("chs").innerHTML=h;open("mBook");
}
$("chs").onclick=e=>{const b=e.target.closest("[data-c]");if(b){const ci=+b.dataset.c;close("mBook");openRead(CS[ci],CS[ci]+CH[ci][2]-1)}};

// ---------- Fortschritt-Modal ----------
function prog(){
  const t=T[S.lang],cov=covered(),pct=Math.round(cov/V*1000)/10,c=[];
  if(S.log.length&&cov>0&&cov<V){
    const first=S.log.reduce((m,l)=>l[2]<m?l[2]:m,S.log[0][2]),el=Math.max(1,dayDiff(first,ymd())+1),avg=cov/el,fin=new Date();
    fin.setDate(fin.getDate()+Math.ceil((V-cov)/avg));
    const diff=cov-Math.min(V,sugg()*el);
    c.push([Math.round(avg),t.perDay],[fmtD(fin,{day:"numeric",month:"short",year:"2-digit"}),t.finish],[diff===0?"✓":(diff>0?"+":"−")+nf(Math.abs(diff)),diff>0?t.ahead:diff<0?t.behind:t.onplan]);
  }
  const ds=[...new Set(S.log.map(l=>l[2]))];let st=0,cur=ymd();
  if(ds.length){if(!ds.includes(cur))cur=addDay(cur,-1);while(ds.includes(cur)){st++;cur=addDay(cur,-1)}}
  c.push([st,t.streak],[ds.length,t.days],[BK.filter((b,i)=>ovl(BS[i],BS[i]+BV[i]-1)>=BV[i]).length,t.bdone]);
  let h='<div class="pct">'+pct+'<small>%</small></div><div class="bar"><i style="width:'+cov/V*100+'%"></i></div><div class="sline">'+nf(cov)+' / '+nf(V)+' '+t.verses+'</div><div class="cells">'+c.map(x=>'<div class="cell"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div><div class="lbl" style="margin-top:1.2rem">'+t.hist+'</div>';
  const rows=S.log.map((l,i)=>[l,i]).sort((a,b)=>-cmp(a,b));
  h+=rows.length?rows.map(x=>'<div class="h"><div><div>'+rng(x[0][0],x[0][1],S.lang)+'</div><em>'+fmtD(new Date(x[0][2]+"T12:00"),{weekday:"short",day:"numeric",month:"short"})+' · '+(x[0][1]-x[0][0]+1)+' '+t.verses+'</em></div><button class="del" data-i="'+x[1]+'" aria-label="x">✕</button></div>').join(""):'<div class="none">'+t.noneH+'</div>';
  $("pBody").innerHTML=h;
}
$("pBody").onclick=e=>{const b=e.target.closest("[data-i]");if(b&&confirm(T[S.lang].del)){S.log.splice(+b.dataset.i,1);save();renderAll()}};

// ---------- Startseite-Events ----------
$("next").onclick=e=>{const b=e.target.closest("[data-a]"),r=nextRange();if(!b||!r)return;if(b.dataset.a==="done")add(r[0],r[1],ymd());else openRead(r[0],r[1])};
$("shelf").onclick=e=>{const b=e.target.closest("[data-b]");if(b)openBook(+b.dataset.b)};
$("bProg").onclick=()=>{prog();open("mProg")};
$("bSet").onclick=()=>{sync();open("mSet")};

// ---------- Einstellungen ----------
const COL=["#3c96ff","#14b8a6","#8b5cf6","#22c55e","#f59e0b","#ec4899","#ef4444"];
$("sw").innerHTML=COL.map(c=>'<button data-c="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>').join("")+'<input type="color" id="accIn">';
$("langSeg").onclick=e=>{const b=e.target.closest("button");if(b){S.lang=b.dataset.l;save();renderAll()}};
$("modeSeg").onclick=e=>{const b=e.target.closest("button");if(b){S.mode=b.dataset.m;save();renderAll()}};
$("thSeg").onclick=e=>{const b=e.target.closest("button");if(b){S.theme=b.dataset.th;save();theme();sync()}};
$("sw").onclick=e=>{const b=e.target.closest("button");if(b){S.acc=b.dataset.c;save();theme();sync()}};
$("accIn").oninput=e=>{S.acc=e.target.value;save();theme();document.querySelectorAll("#sw button").forEach(b=>b.classList.remove("on"))};
$("dimIn").oninput=e=>{S.dim=+e.target.value;save();theme()};
$("bgIn").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image,u=URL.createObjectURL(f);
  img.onload=()=>{
    const r=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    BGD=c.toDataURL("image/jpeg",.78);try{localStorage.setItem(BGK,BGD)}catch(_){}
    URL.revokeObjectURL(u);theme();
  };
  img.src=u;e.target.value="";
};
$("bgRm").onclick=()=>{BGD=null;try{localStorage.removeItem(BGK)}catch(_){}theme()};
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({log:S.log})],{type:"application/json"}));a.download="bibel-leseplan-backup.json";a.click()};
$("imp").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(x=>{try{const j=JSON.parse(x);if(Array.isArray(j.log)){S.log=j.log.filter(l=>Array.isArray(l)&&l.length===3&&l[0]>=0&&l[1]<V&&l[0]<=l[1]);save();renderAll();toast(T[S.lang].saved)}}catch(_){}});
  e.target.value="";
};
$("reset").onclick=()=>{if(confirm(T[S.lang].ask)){S.log=[];save();renderAll()}};

theme();renderAll();
</script>
</body>
